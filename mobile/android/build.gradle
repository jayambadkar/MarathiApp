buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 37
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.4.20"
        agpVersion = "9.4.1"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:${agpVersion}")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Silence Kotlin warnings from third-party native modules (reanimated,
// screens, gesture-handler, ...): the new compiler surfaces deprecation
// noise in library sources we don't own. Our own sources stay clean.
subprojects {
    plugins.withId("org.jetbrains.kotlin.android") {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            it.compilerOptions.freeCompilerArgs.add("-nowarn")
        }
    }
}
